<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Maison Maire</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script>if (!isLoggedIn()) window.location.href = 'login.html';</script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root,
        [data-theme="dark"] {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-2: #1a1a1a;
            --border: #232323;
            --border-hover: #333;
            --text: #e0e0e0;
            --text-muted: #777;
            --text-faint: #444;
            --white: #fff;
            --accent: #5c5cff;
            --accent-hover: #4a4aee;
            --danger: #ff6b6b;
            --success: #4ecdc4;
            --radius: 12px;
            --transition: 0.2s ease;
        }

        [data-theme="light"] {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --surface-2: #f0f0f2;
            --border: #e0e0e0;
            --border-hover: #ccc;
            --text: #1a1a1a;
            --text-muted: #666;
            --text-faint: #999;
            --white: #111;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
        }

        .sidebar-logo {
            padding: 0 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .sidebar-logo h1 {
            font-size: 1.1rem;
            color: var(--white);
            font-weight: 700;
        }

        .sidebar-logo span {
            font-size: 0.72rem;
            color: var(--accent);
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .sidebar-nav { flex: 1; padding: 0 0.75rem; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover { background: var(--surface-2); color: var(--text); }
        .nav-item.active { background: var(--accent)15; color: var(--accent); }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

        .sidebar-footer {
            padding: 1rem 0.75rem 0;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar h2 { font-size: 1.15rem; color: var(--white); font-weight: 600; }

        .topbar-actions { display: flex; gap: 0.5rem; align-items: center; }

        .content { padding: 1.5rem 2rem; flex: 1; }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }

        .btn svg { width: 15px; height: 15px; }

        .btn-ghost { background: transparent; color: var(--text-muted); }
        .btn-ghost:hover { color: var(--text); border-color: var(--border-hover); }

        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-danger { background: transparent; border-color: var(--danger)44; color: var(--danger); }
        .btn-danger:hover { background: var(--danger)11; }

        .btn-sm { padding: 0.35rem 0.6rem; font-size: 0.78rem; }
        .btn-sm svg { width: 14px; height: 14px; }

        .btn-icon {
            padding: 0.4rem;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .btn-icon:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }
        .btn-icon.danger:hover { color: var(--danger); }

        /* ===== TABLE ===== */
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            text-align: left;
            padding: 0.75rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
        }

        td {
            padding: 0.8rem 1rem;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--surface-2); }

        .service-cell {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .service-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .service-icon svg { width: 18px; height: 18px; }

        .service-info { min-width: 0; }
        .service-name { font-weight: 600; color: var(--white); }
        .service-url { font-size: 0.75rem; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px; display: block; }

        .cat-badge {
            display: inline-block;
            padding: 0.2rem 0.55rem;
            border-radius: 20px;
            font-size: 0.72rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .actions-cell { display: flex; gap: 0.25rem; }

        .empty-table {
            padding: 3rem;
            text-align: center;
            color: var(--text-faint);
            font-size: 0.9rem;
        }

        /* ===== STATS ===== */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.1rem 1.25rem;
        }

        .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.3rem; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--white); }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #000a;
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 { font-size: 1.1rem; color: var(--white); }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 1.1rem; }
        .form-group label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.35rem; font-weight: 500; }

        .form-input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
            transition: border-color var(--transition);
        }

        .form-input:focus { border-color: var(--accent)88; }
        textarea.form-input { resize: vertical; min-height: 65px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

        .color-row { display: flex; align-items: center; gap: 0.5rem; }
        .color-row input[type="color"] {
            width: 40px; height: 36px; padding: 2px;
            border: 1px solid var(--border); border-radius: 6px;
            background: var(--bg); cursor: pointer;
        }
        .color-row .form-input { flex: 1; }

        .form-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }

        /* ===== ICON PICKER ===== */
        .icon-picker-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            transition: border-color var(--transition);
        }

        .icon-picker-trigger:hover { border-color: var(--border-hover); }
        .icon-picker-trigger svg { width: 18px; height: 18px; }

        .icon-dropdown {
            display: none;
            margin-top: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            max-height: 220px;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .icon-dropdown.open { display: block; }

        .icon-search {
            width: 100%;
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.78rem;
            outline: none;
            margin-bottom: 0.4rem;
        }

        .icon-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
            gap: 2px;
        }

        .icon-opt {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            color: var(--text-muted);
        }

        .icon-opt:hover { background: var(--surface-2); color: var(--white); border-color: var(--border); }
        .icon-opt.selected { background: var(--accent)22; border-color: var(--accent)55; color: var(--accent); }
        .icon-opt svg { width: 18px; height: 18px; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.6rem 1.2rem;
            font-size: 0.82rem;
            color: var(--text);
            z-index: 200;
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            pointer-events: none;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* ===== CONFIRM ===== */
        .confirm-text { font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; }

        /* ===== LANG PICKER ===== */
        .lang-picker { position: relative; }
        .lang-trigger { display:flex;align-items:center;gap:0.4rem;padding:0.35rem 0.55rem;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:0.78rem;font-weight:500;cursor:pointer;font-family:inherit;transition:0.2s ease;white-space:nowrap; }
        .lang-trigger:hover { border-color:var(--border-hover);color:var(--text); }
        .lang-trigger img { border-radius:2px;flex-shrink:0; }
        .lang-trigger svg { opacity:0.5;flex-shrink:0; }
        .lang-dropdown { display:none;position:absolute;top:calc(100% + 4px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;min-width:150px;box-shadow:0 8px 24px #0003;z-index:60; }
        .lang-dropdown.open { display:block; }
        .lang-option { display:flex;align-items:center;gap:0.5rem;width:100%;padding:0.45rem 0.6rem;border:none;background:none;border-radius:7px;color:var(--text-muted);font-size:0.8rem;font-family:inherit;cursor:pointer;transition:0.2s ease; }
        .lang-option:hover { background:var(--surface-2);color:var(--text); }
        .lang-option.active { color:var(--white);font-weight:600; }
        .lang-option img { border-radius:2px;flex-shrink:0; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .topbar { padding: 1rem; }
            .content { padding: 1rem; }
            .form-row { grid-template-columns: 1fr; }
            .stats { grid-template-columns: 1fr 1fr; }

            .mobile-menu-btn { display: flex !important; }
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 0.3rem;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h1>Maison Maire</h1>
            <span data-i18n="admin.label">Administration</span>
        </div>
        <nav class="sidebar-nav">
            <a href="admin.html" class="nav-item active">
                <i data-lucide="layout-grid"></i> <span data-i18n="admin.nav_services">Services</span>
            </a>
            <a href="index.html" class="nav-item">
                <i data-lucide="external-link"></i> <span data-i18n="admin.nav_hub">Voir le hub</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="nav-item" onclick="handleExport()">
                <i data-lucide="download"></i> <span data-i18n="admin.export">Exporter</span>
            </button>
            <button class="nav-item" onclick="handleImport()">
                <i data-lucide="upload"></i> <span data-i18n="admin.import">Importer</span>
            </button>
            <div style="border-top:1px solid var(--border);margin-top:0.5rem;padding-top:0.5rem">
                <div style="padding:0.4rem 0.75rem;font-size:0.78rem;color:var(--text-faint);display:flex;align-items:center;gap:0.4rem">
                    <i data-lucide="user" style="width:14px;height:14px"></i>
                    <span id="session-user"></span>
                </div>
                <button class="nav-item" onclick="logout()" style="color:var(--danger)">
                    <i data-lucide="log-out"></i> <span data-i18n="admin.logout">Déconnexion</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main -->
    <div class="main">
        <div class="topbar">
            <h2 data-i18n="admin.title">Gestion des services</h2>
            <div class="topbar-actions">
                <script>document.write(buildLangSelector())</script>
                <div id="theme-toggle" style="display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:0;align-items:center">
                    <button class="theme-btn" data-theme="light" onclick="setThemePref('light')" title="Clair" data-i18n-title="theme.light" style="background:none;border:none;border-radius:7px;color:var(--text-faint);padding:0.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s ease">
                        <i data-lucide="sun" style="width:15px;height:15px"></i>
                    </button>
                    <button class="theme-btn" data-theme="system" onclick="setThemePref('system')" title="Système" data-i18n-title="theme.system" style="background:none;border:none;border-radius:7px;color:var(--text-faint);padding:0.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s ease">
                        <i data-lucide="monitor" style="width:15px;height:15px"></i>
                    </button>
                    <button class="theme-btn" data-theme="dark" onclick="setThemePref('dark')" title="Sombre" data-i18n-title="theme.dark" style="background:none;border:none;border-radius:7px;color:var(--text-faint);padding:0.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s ease">
                        <i data-lucide="moon" style="width:15px;height:15px"></i>
                    </button>
                </div>
                <button class="btn btn-primary" onclick="openForm()">
                    <i data-lucide="plus"></i> <span data-i18n="admin.new_service">Nouveau service</span>
                </button>
            </div>
        </div>

        <div class="content">
            <!-- Stats -->
            <div class="stats" id="stats"></div>

            <!-- Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="admin.th_service">Service</th>
                            <th data-i18n="admin.th_category">Catégorie</th>
                            <th data-i18n="admin.th_description">Description</th>
                            <th style="width:100px;text-align:right" data-i18n="admin.th_actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
                <div class="empty-table" id="empty" style="display:none" data-i18n="admin.empty_table">
                    Aucun service. Cliquez sur "Nouveau service" pour commencer.
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Scripts -->
    <script src="js/icons.js"></script>
    <script src="js/services.js"></script>
    <script>
        let selectedIcon = 'globe';

        // ===== RENDER =====
        function render() {
            const services = loadServices();
            renderStats(services);
            renderTable(services);
            translatePage();
            translatePlaceholders();
            lucide.createIcons();
        }

        function renderStats(services) {
            const cats = [...new Set(services.map(s => s.category).filter(Boolean))];
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label" data-i18n="admin.total_services">${t('admin.total_services')}</div>
                    <div class="stat-value">${services.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label" data-i18n="admin.categories">${t('admin.categories')}</div>
                    <div class="stat-value">${cats.length}</div>
                </div>
            `;
        }

        function renderTable(services) {
            const tbody = document.getElementById('table-body');
            const empty = document.getElementById('empty');

            if (services.length === 0) {
                tbody.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            tbody.innerHTML = services
                .sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
                .map(s => `
                    <tr>
                        <td>
                            <div class="service-cell">
                                <div class="service-icon" style="background:${s.color}18;color:${s.color}">
                                    <i data-lucide="${s.icon}"></i>
                                </div>
                                <div class="service-info">
                                    <div class="service-name">${esc(s.name)}</div>
                                    <span class="service-url">${esc(s.url)}</span>
                                </div>
                            </div>
                        </td>
                        <td><span class="cat-badge">${esc(s.category || 'Autre')}</span></td>
                        <td style="color:var(--text-muted);font-size:0.82rem;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.description)}</td>
                        <td>
                            <div class="actions-cell" style="justify-content:flex-end">
                                <button class="btn-icon" onclick="openForm('${s.id}')" title="${t('admin.edit_service')}">
                                    <i data-lucide="pen" style="width:15px;height:15px"></i>
                                </button>
                                <button class="btn-icon danger" onclick="confirmDelete('${s.id}','${esc(s.name)}')" title="${t('admin.delete')}">
                                    <i data-lucide="trash-2" style="width:15px;height:15px"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
        }

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        // ===== MODAL =====
        function openModal(html) {
            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-content').innerHTML = html;
            overlay.classList.add('open');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('open');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ===== FORM =====
        function openForm(id) {
            const services = loadServices();
            const s = id ? services.find(x => x.id === id) : null;
            selectedIcon = s ? (s.icon || 'globe') : 'globe';
            const categories = getCategories();

            openModal(`
                <div class="modal-header">
                    <h2>${s ? t('admin.edit_service') : t('admin.new_service_title')}</h2>
                    <button class="btn-icon" onclick="closeModal()">
                        <i data-lucide="x" style="width:18px;height:18px"></i>
                    </button>
                </div>
                <form id="svc-form" onsubmit="submitForm(event, ${s ? `'${s.id}'` : 'null'})">
                    <div class="form-group">
                        <label>${t('admin.form_name')}</label>
                        <input class="form-input" type="text" name="name" value="${s ? esc(s.name) : ''}" required placeholder="${t('admin.placeholder_name')}">
                    </div>
                    <div class="form-group">
                        <label>${t('admin.form_description')}</label>
                        <textarea class="form-input" name="description" placeholder="${t('admin.placeholder_description')}">${s ? esc(s.description) : ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>${t('admin.form_url')}</label>
                        <input class="form-input" type="url" name="url" value="${s ? esc(s.url) : ''}" required placeholder="https://...">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>${t('admin.form_category')}</label>
                            <input class="form-input" type="text" name="category" value="${s ? esc(s.category) : ''}" placeholder="${t('admin.placeholder_category')}" list="cat-list">
                            <datalist id="cat-list">${categories.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
                        </div>
                        <div class="form-group">
                            <label>${t('admin.form_color')}</label>
                            <div class="color-row">
                                <input type="color" name="colorPicker" value="${s ? s.color : '#5c5cff'}" oninput="this.form.color.value=this.value">
                                <input class="form-input" type="text" name="color" value="${s ? s.color : '#5c5cff'}" pattern="^#[0-9a-fA-F]{6}$" oninput="this.form.colorPicker.value=this.value">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>${t('admin.form_icon')}</label>
                        <button type="button" class="icon-picker-trigger" onclick="togglePicker()">
                            <i data-lucide="${selectedIcon}"></i>
                            <span id="icon-label">${selectedIcon}</span>
                        </button>
                        <div class="icon-dropdown" id="icon-dropdown">
                            <input type="text" class="icon-search" placeholder="${t('admin.placeholder_search')}" oninput="filterIconList(this.value)">
                            <div class="icon-list" id="icon-list"></div>
                        </div>
                        <input type="hidden" name="icon" id="icon-val" value="${selectedIcon}">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-ghost" onclick="closeModal()">${t('admin.cancel')}</button>
                        <button type="submit" class="btn btn-primary">${s ? t('admin.save') : t('admin.add')}</button>
                    </div>
                </form>
            `);

            buildIconList();
        }

        function submitForm(e, id) {
            e.preventDefault();
            const f = e.target;
            const data = {
                name: f.name.value.trim(),
                description: f.description.value.trim(),
                url: f.url.value.trim(),
                icon: f.icon.value,
                color: f.color.value,
                category: f.category.value.trim() || 'Autre'
            };

            if (id) {
                updateService(id, data);
                showToast(t('toast.service_updated'));
            } else {
                addService(data);
                showToast(t('toast.service_added'));
            }

            closeModal();
            render();
        }

        // ===== ICON PICKER =====
        function buildIconList() {
            const grid = document.getElementById('icon-list');
            if (!grid) return;
            grid.innerHTML = '';
            ICON_LIST.forEach(name => {
                const opt = document.createElement('div');
                opt.className = 'icon-opt' + (name === selectedIcon ? ' selected' : '');
                opt.title = name;
                opt.innerHTML = `<i data-lucide="${name}"></i>`;
                opt.onclick = () => pickIcon(name);
                grid.appendChild(opt);
            });
            lucide.createIcons();
        }

        function togglePicker() {
            document.getElementById('icon-dropdown').classList.toggle('open');
        }

        function filterIconList(q) {
            q = q.toLowerCase();
            document.querySelectorAll('#icon-list .icon-opt').forEach(o => {
                o.style.display = o.title.includes(q) ? '' : 'none';
            });
        }

        function pickIcon(name) {
            selectedIcon = name;
            document.getElementById('icon-val').value = name;
            document.getElementById('icon-label').textContent = name;

            const trigger = document.querySelector('.icon-picker-trigger');
            trigger.querySelector('i').setAttribute('data-lucide', name);

            document.querySelectorAll('#icon-list .icon-opt').forEach(o => {
                o.classList.toggle('selected', o.title === name);
            });

            lucide.createIcons();
            togglePicker();
        }

        // ===== DELETE =====
        function confirmDelete(id, name) {
            openModal(`
                <div class="modal-header">
                    <h2>${t('admin.delete_title')}</h2>
                    <button class="btn-icon" onclick="closeModal()">
                        <i data-lucide="x" style="width:18px;height:18px"></i>
                    </button>
                </div>
                <p class="confirm-text" style="margin-bottom:1.5rem">
                    ${t('admin.delete_confirm', { name: name })}
                </p>
                <div class="form-actions">
                    <button class="btn btn-ghost" onclick="closeModal()">${t('admin.cancel')}</button>
                    <button class="btn btn-danger" onclick="doDelete('${id}')">${t('admin.delete')}</button>
                </div>
            `);
        }

        function doDelete(id) {
            deleteService(id);
            closeModal();
            showToast(t('toast.service_deleted'));
            render();
        }

        // ===== EXPORT / IMPORT =====
        function handleExport() {
            exportServices();
            showToast(t('toast.export_done'));
        }

        function handleImport() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    await importServices(file);
                    showToast(t('toast.import_done'));
                    render();
                } catch {
                    showToast(t('toast.import_error'));
                }
            };
            input.click();
        }

        // ===== INIT =====
        document.getElementById('modal-overlay').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        // Show session user
        const session = getSession();
        if (session) {
            document.getElementById('session-user').textContent = session.username;
        }

        render();
    </script>
</body>
</html>
