<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Maison Maire</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/theme.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root,
        [data-theme="dark"] {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-2: #1a1a1a;
            --border: #232323;
            --border-hover: #333;
            --text: #e0e0e0;
            --text-muted: #777;
            --text-faint: #444;
            --white: #fff;
            --accent: #5c5cff;
            --accent-hover: #4a4aee;
            --danger: #ff6b6b;
            --radius: 12px;
            --transition: 0.2s ease;
        }

        [data-theme="light"] {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --surface-2: #f0f0f2;
            --border: #e0e0e0;
            --border-hover: #ccc;
            --text: #1a1a1a;
            --text-muted: #666;
            --text-faint: #999;
            --white: #111;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header .logo-icon {
            width: 56px;
            height: 56px;
            background: var(--accent)18;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .auth-header .logo-icon svg { width: 28px; height: 28px; }
        .auth-header h1 { font-size: 1.4rem; color: var(--white); font-weight: 700; }
        .auth-header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.4rem; }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
        }

        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 0.7rem 0;
            text-align: center;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
        }

        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .form-group { margin-bottom: 1rem; }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 0.75rem;
            color: var(--text-faint);
            pointer-events: none;
            display: flex;
        }

        .input-wrapper .input-icon svg { width: 16px; height: 16px; }

        .form-input {
            width: 100%;
            padding: 0.65rem 0.75rem 0.65rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.88rem;
            outline: none;
            font-family: inherit;
            transition: border-color var(--transition);
        }

        .form-input:focus { border-color: var(--accent)88; }
        .form-input::placeholder { color: var(--text-faint); }

        .toggle-password {
            position: absolute;
            right: 0.5rem;
            background: none;
            border: none;
            color: var(--text-faint);
            cursor: pointer;
            padding: 0.3rem;
            display: flex;
            transition: var(--transition);
        }

        .toggle-password:hover { color: var(--text-muted); }
        .toggle-password svg { width: 16px; height: 16px; }

        .btn-submit {
            width: 100%;
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            transition: var(--transition);
            margin-top: 0.5rem;
        }

        .btn-submit:hover { background: var(--accent-hover); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .error-msg {
            display: none;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            background: var(--danger)11;
            border: 1px solid var(--danger)33;
            color: var(--danger);
            font-size: 0.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .error-msg.visible { display: block; }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
        }

        .auth-footer a {
            color: var(--text-muted);
            font-size: 0.82rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: var(--transition);
        }

        .auth-footer a:hover { color: var(--text); }
        .auth-footer a svg { width: 14px; height: 14px; }

        .form-pane { display: none; }
        .form-pane.active { display: block; }

        .lang-picker { position: relative; }
        .lang-trigger { display:flex;align-items:center;gap:0.4rem;padding:0.35rem 0.55rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:0.78rem;font-weight:500;cursor:pointer;font-family:inherit;transition:0.2s ease;white-space:nowrap; }
        .lang-trigger:hover { border-color:var(--border-hover);color:var(--text); }
        .lang-trigger img { border-radius:2px;flex-shrink:0; }
        .lang-trigger svg { opacity:0.5;flex-shrink:0; }
        .lang-dropdown { display:none;position:absolute;top:calc(100% + 4px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;min-width:150px;box-shadow:0 8px 24px #0003;z-index:60; }
        .lang-dropdown.open { display:block; }
        .lang-option { display:flex;align-items:center;gap:0.5rem;width:100%;padding:0.45rem 0.6rem;border:none;background:none;border-radius:7px;color:var(--text-muted);font-size:0.8rem;font-family:inherit;cursor:pointer;transition:0.2s ease; }
        .lang-option:hover { background:var(--surface-2);color:var(--text); }
        .lang-option.active { color:var(--white);font-weight:600; }
        .lang-option img { border-radius:2px;flex-shrink:0; }
    </style>
</head>
<body>

    <div style="position:fixed;top:1.5rem;right:1.5rem;display:flex;align-items:center;gap:0.5rem">
        <script>document.write(buildLangSelector())</script>
        <div id="theme-toggle" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;padding:3px;gap:0;align-items:center">
            <button class="theme-btn" data-theme="light" onclick="setThemePref('light')" title="Clair" data-i18n-title="theme.light" style="background:none;border:none;border-radius:7px;color:var(--text-faint);padding:0.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s ease">
                <i data-lucide="sun" style="width:15px;height:15px"></i>
            </button>
            <button class="theme-btn" data-theme="system" onclick="setThemePref('system')" title="Système" data-i18n-title="theme.system" style="background:none;border:none;border-radius:7px;color:var(--text-faint);padding:0.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s ease">
                <i data-lucide="monitor" style="width:15px;height:15px"></i>
            </button>
            <button class="theme-btn" data-theme="dark" onclick="setThemePref('dark')" title="Sombre" data-i18n-title="theme.dark" style="background:none;border:none;border-radius:7px;color:var(--text-faint);padding:0.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s ease">
                <i data-lucide="moon" style="width:15px;height:15px"></i>
            </button>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo-icon"><i data-lucide="layout-grid"></i></div>
            <h1>Maison Maire</h1>
            <p data-i18n="login.subtitle">Connectez-vous pour accéder à l'administration</p>
        </div>

        <div class="auth-card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')" data-i18n="login.tab_login">Connexion</button>
                <button class="tab" onclick="switchTab('register')" data-i18n="login.tab_register">Inscription</button>
            </div>

            <div class="error-msg" id="error"></div>

            <!-- Login -->
            <form class="form-pane active" id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label data-i18n="login.username">Nom d'utilisateur</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i data-lucide="user"></i></span>
                        <input class="form-input" type="text" name="username" placeholder="admin" data-i18n-placeholder="login.placeholder_username" autocomplete="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="login.password">Mot de passe</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i data-lucide="lock"></i></span>
                        <input class="form-input" type="password" name="password" placeholder="••••••••" data-i18n-placeholder="login.placeholder_password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" onclick="togglePass(this)">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-submit" data-i18n="login.submit_login">Se connecter</button>
            </form>

            <!-- Register -->
            <form class="form-pane" id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label data-i18n="login.username">Nom d'utilisateur</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i data-lucide="user"></i></span>
                        <input class="form-input" type="text" name="username" placeholder="Choisissez un pseudo" data-i18n-placeholder="login.placeholder_new_username" autocomplete="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="login.password">Mot de passe</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i data-lucide="lock"></i></span>
                        <input class="form-input" type="password" name="password" placeholder="Min. 4 caractères" data-i18n-placeholder="login.placeholder_new_password" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" onclick="togglePass(this)">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="login.confirm_password">Confirmer le mot de passe</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i data-lucide="lock"></i></span>
                        <input class="form-input" type="password" name="confirmPassword" placeholder="••••••••" data-i18n-placeholder="login.placeholder_password" autocomplete="new-password" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" data-i18n="login.submit_register">Créer un compte</button>
            </form>
        </div>

        <div class="auth-footer">
            <a href="index.html"><i data-lucide="arrow-left"></i> <span data-i18n="login.back">Retour au hub</span></a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Redirect if already logged in
        if (isLoggedIn()) window.location.href = 'admin.html';

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-pane').forEach(f => f.classList.remove('active'));
            document.getElementById('error').classList.remove('visible');

            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.classList.add('visible');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const form = e.target;
            const result = await login(form.username.value.trim(), form.password.value);
            if (result.ok) {
                window.location.href = 'admin.html';
            } else {
                showError(result.error);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const form = e.target;
            const username = form.username.value.trim();
            const password = form.password.value;
            const confirm = form.confirmPassword.value;

            if (password !== confirm) {
                showError(t('error.passwords_mismatch'));
                return;
            }

            const result = await register(username, password);
            if (result.ok) {
                window.location.href = 'admin.html';
            } else {
                showError(result.error);
            }
        }

        function togglePass(btn) {
            const input = btn.parentElement.querySelector('input');
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}"></i>`;
            lucide.createIcons();
        }

        translatePage();
        translatePlaceholders();
        lucide.createIcons();
    </script>
</body>
</html>
